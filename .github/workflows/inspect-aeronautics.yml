name: Inspect Kenny translation links
on:
  push:
    paths:
      - .github/workflows/inspect-aeronautics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect official Kenny site and sitemap
        run: python scripts/inspect_kenny_links.py

