name: Review Aeronautics portrait reference
on:
  push:
    paths:
      - .github/workflows/inspect-pose-reference.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-save playwright-core@1.57.0
      - name: Open correct official page in Chromium and screenshot
        run: |
          mkdir -p qa-shots
          node scripts/inspect_aeronautics.cjs
      - name: Save reference for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-shots/aeronautics-reference.jpg
          git commit -m "Capture Aeronautics pose reference for QA"
          git push origin HEAD:main
