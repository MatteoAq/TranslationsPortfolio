name: Fetch Sheiny official Mojang skin
on:
  push:
    paths:
      - .github/workflows/fetch-sheiny-skin.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-official-skin:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests Pillow
      - run: python scripts/fetch_sheiny_skin.py
      - name: Save authentic Mojang skin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sheiny-official-skin.png
          if git diff --cached --quiet; then
            echo "Official skin unchanged"
          else
            git commit -m "Store Sheiny official Mojang skin texture"
            git push origin HEAD:main
          fi

# Follow-up run: Mojang texture metadata may use HTTP URLs.
