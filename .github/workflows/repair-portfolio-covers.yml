name: Replace unverified modpack covers
on:
  push:
    paths:
      - .github/workflows/repair-portfolio-covers.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-replace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests Pillow
      - name: Download only authenticated official gallery shots
        run: python scripts/repair_portfolio_covers.py
      - name: Syntax and asset integrity
        run: |
          node --check app.js
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('assets/cover-audit.json').read_text())
          assert len(data)==15,len(data)
          print('Audited 15 entries, 15 present')
          PY
      - name: Commit vetted assets and source registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/verified-*.webp assets/cover-audit.json app.js index.html
          if git diff --cached --quiet; then
            echo "No cover changes"
          else
            git commit -m "Replace unsupported artwork with original modpack gallery images"
            git push origin HEAD:main
          fi
