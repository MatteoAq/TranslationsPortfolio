name: Audit published portfolio images
on:
  push:
    paths:
      - .github/workflows/check-published-images.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Inspect published GitHub Pages assets in Chromium
        run: node scripts/check_published_covers.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-image-audit
          path: qa-shots/
          retention-days: 7
