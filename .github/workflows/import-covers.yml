name: Import modpack cover images
on:
  push:
    paths:
      - .github/workflows/import-covers.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check requests Pillow
      - name: Download, verify, and localize cover images
        run: python scripts/import_covers.py
      - name: Commit downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets index.html app.js
          if git diff --cached --quiet; then
            echo "No new images downloaded"
          else
            git commit -m "Vendor verified modpack cover images locally"
            git push origin HEAD:main
          fi

# One-time second pass: alternate Stranded at Sea cover source
